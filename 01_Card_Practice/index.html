<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <div>
            <img src="https://images.unsplash.com/photo-1496345875659-11f7dd282d1d?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Avatar">
        </div>
        <div class="info">
            <div class="details">
                <h2>Danny McLoan</h2>
                <span>Web Developer</span>
            </div>
            <div class="social_info">
                <div class="contribution">
                    <p>Contribution</p>
                    <p>41</p>
                </div>
                 <div class="Followers">
                    <p>Followers</p>
                    <p>976</p>
                </div>
                <div class="rating">
                    <p>Rating</p>
                    <p>8.5</p>
                </div>
            </div>
            <div class="btn">
                <button class="chat">CHAT</button>
                <button class="follow">FOLLOW</button>
            </div>
        </div>
    </div>
</body>
</html>
